name: Ports

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: go
          version: v2.13.1
      - name: Test
        working-directory: go
        run: go test -race -count=3 ./...
      - name: Golden determinism canary (twice)
        working-directory: go
        run: |
          go test -run TestGoldenScenario -count=1 ./...
          go test -run TestGoldenScenario -count=1 ./...

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets
      - name: Clippy thread-safe feature
        working-directory: rust
        run: cargo clippy --all-targets --features thread-safe
      - name: Test
        working-directory: rust
        run: cargo test
      - name: Test thread-safe feature
        working-directory: rust
        run: cargo test --features thread-safe

  zig:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Test
        working-directory: zig
        run: zig build test --summary all

  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Flake check
        run: nix flake check

  upstream-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # cordiverse/cordis main at the fork's last packages/** sync. Bump this
      # SHA in the same commit as every packages/** sync.
      UPSTREAM_PIN: caab04ecf5c5718b974a4b556a8e29d830defd1b
      PRETTIER_VERSION: 3.9.6
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch upstream pin
        run: |
          git remote add upstream https://github.com/cordiverse/cordis.git
          git fetch --depth 1 upstream "$UPSTREAM_PIN"
      - name: Byte guard - non-TS files must match the pin exactly
        run: |
          git diff --exit-code "$UPSTREAM_PIN" -- packages/ \
            ':(exclude)*.ts' ':(exclude)*.js' ':(exclude)**/package.json'
      - name: Semantic guard - TS/JS may differ from the pin only by prettier formatting
        run: |
          rm -rf /tmp/pin-tree /tmp/fork-tree
          mkdir -p /tmp/pin-tree /tmp/fork-tree
          git archive "$UPSTREAM_PIN" packages | tar -x -C /tmp/pin-tree
          git ls-files -co --exclude-standard packages | tar -cf - -T - | tar -x -C /tmp/fork-tree
          npx --yes "prettier@$PRETTIER_VERSION" --print-width 100 --write \
            "/tmp/pin-tree/packages/**/*.{ts,js}" "/tmp/fork-tree/packages/**/*.{ts,js}"
          diff -r --exclude=package.json /tmp/fork-tree/packages /tmp/pin-tree/packages
      - name: Guard dprint.json keeps excluding packages
        run: jq -e '.excludes | index("packages/**")' dprint.json
