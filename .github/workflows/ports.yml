name: Ports

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Lint
        working-directory: go
        run: golangci-lint run
      - name: Test
        working-directory: go
        run: go test -race -count=3 ./...
      - name: Golden determinism canary (twice)
        working-directory: go
        run: |
          go test -run TestGoldenScenario -count=1 ./...
          go test -run TestGoldenScenario -count=1 ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- --deny warnings
      - name: Test
        working-directory: rust
        run: cargo test

  zig:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test
        working-directory: zig
        run: zig build test --summary all
