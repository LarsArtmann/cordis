[package]
name = "cordis"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A meta-framework of spatiotemporal composability, Rust port of cordis"

[features]
thread-safe = []

[lints.clippy]
# Aspirationally deny-level (see TODO_LIST.md): pedantic and nursery are
# warn until the current ~200 violations are paid down; the hard rules below
# are the ones the codebase actually holds today.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unreachable = "warn"
unimplemented = "warn"
todo = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
panic = "warn"
exit = "warn"
as_conversions = "warn"

[dependencies]
