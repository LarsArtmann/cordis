[package]
name = "cordis"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A meta-framework of spatiotemporal composability, Rust port of cordis"

[features]
thread-safe = []

[lints.clippy]
# Group denies (pedantic, nursery) are MSRV-stable; explicit lint names must exist on the project's MSRV (rust-version).
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dependencies]
