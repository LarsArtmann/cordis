# BuildFlow configuration for the cordis polyglot fork.
# Go lives in go/, Rust in rust/, Zig in zig/ — run buildflow from inside
# the flake devShell (`nix develop -c buildflow`) so go 1.27 / zig / cargo
# resolve; the system Go is older than the module requires.

build_mode: full

exclude:
  - vendor
  - .git
  - node_modules
  - "**/lib"
  - "**/dist"
  - rust/target
  - .zig-cache
  - zig-out
  - result
  - .turbo
  - .yarn

# Skips are policy, not neglect — each names the owner that covers the gap:
skip_steps:
  # go-auto-upgrade suggests samber/lo (go.mod is deliberately zero-dependency)
  # and encoding/json/v2 (GOEXPERIMENT-gated; its own finding warns the v2 swap
  # has runtime-only failure modes). Port is parity-locked; see ROADMAP.md.
  - go-auto-upgrade
  # The TS workspace migrated from ESLint to oxlint (upstream #326, pin
  # 68c9d99): there is no eslint dependency or config anymore. TS linting
  # is owned by `yarn lint` (oxlint, driven by upstream's oxlint.config.ts)
  # in the packages/ workspace; buildflow has no oxlint step to enable.
  - eslint-fix
  # tsc runs at the repo root without the workspace node_modules
  # (TS2688: @types/node unresolvable); TS checking is owned by the yarn
  # workspace build (yarn build / dts).
  - type-check
  # 350-line cap fights the ports' deliberate file organization: the Zig
  # port is one comptime module by design (golden DSL runner shares the
  # lifecycle interpreter), go/fiber.go is the reference port's state
  # machine, and the big Go files are table/golden-heavy tests on a
  # parity-locked surface. Splitting is tracked in TODO_LIST.md; new-code
  # file hygiene stays owned by the structure linter.
  - file-size-check
  # Buildflow's bare `vitest` invocation cannot reproduce the workspace
  # test semantics: cross-package imports must resolve through the root
  # tsconfig paths to src (yakumo vitest + tsx), or stack-frame specs like
  # include/tests/location.spec.ts see built lib/ frames instead of
  # src/**/tree.ts; the package-manager specs additionally need corepack's
  # per-project yarn dispatch, which the devShell's yarn-berry binary does
  # not provide. TS tests are owned by `yarn test` (CI build.yml "Unit
  # Test" runs yarn test:json; baseline 926 passed / 13 skipped / 939).
  - vitest-test
