# BuildFlow configuration for the cordis polyglot fork.
# Go lives in go/, Rust in rust/, Zig in zig/. Run buildflow from inside
# the flake devShell (`nix develop -c buildflow`) so go 1.27 / zig / cargo
# resolve; the system Go is older than the module requires.

# The ports' deliberate file organization outgrew buildflow's 350-line cap
# (go/fiber.go is the reference state machine at 760 lines), but the check
# still keeps new code bounded; file-size-check ran clean at this limit on
# 2026-11-15.
max_file_size: 800

exclude:
  - "**/lib"
  - "**/dist"
  - rust/target
  - .zig-cache
  - zig-out
  - result
  - .yarn

# Skips are policy, not neglect. Every entry was re-tested by re-enabling it
# and running it against buildflow 1d474a0 on 2026-11-15; comments state why
# the skip stands, not merely what the tool reports.
skip_steps:
  # go-auto-upgrade is green but its findings are policy conflicts: samber/lo
  # suggestions (go.mod is deliberately zero-dependency) and the
  # encoding/json/v2 rewrite, whose own finding warns the swap has
  # runtime-only failure modes. Port is parity-locked; see ROADMAP.md.
  # policy verified 2026-11-15.
  - go-auto-upgrade
  # type-check runs now (the old root TS2688 failure is gone), but tsc
  # resolves the FIRST tsconfig directory only (packages/cli-cordis) and
  # silently leaves the other 15 workspace packages unchecked: a false green,
  # not coverage. Full workspace type checking is owned by `yarn build`
  # (yakumo tsc + dts).
  - type-check
  # Bare `vitest run` cannot reproduce the workspace suite: 13 failures on
  # 2026-11-15 (5x "yarn is not found in PATH" in the package-manager specs,
  # 7 hmr waitFor timeouts, and include/tests/location.spec.ts matching built
  # lib/ frames instead of src/). TS tests are owned by `yarn test`
  # (`yarn yakumo vitest --import tsx`; CI baseline 926 passed / 13 skipped /
  # 939 total).
  - vitest-test
